# alembic.ini
# -----------
# Alembic configuration for LEARNABLE / SAIS backend.
# Run migrations from the `backend/` directory:
#   alembic upgrade head       — apply all pending migrations
#   alembic revision --autogenerate -m "your message"  — create a new migration

[alembic]
# Path to migration scripts
script_location = alembic

# Jinja2 template used for generating migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration filenames
timezone = UTC

# DB URL is read at runtime from DATABASE_URL env var (see alembic/env.py)
# sqlalchemy.url is intentionally left blank here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
